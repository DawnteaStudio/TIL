name: Reconcile learning indexes

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reconcile-readmes-main
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate indexes on the current main branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin refs/heads/main
            git reset --hard FETCH_HEAD
            npm ci
            node scripts/article-toc.mjs --write
            node scripts/reconcile-source-readmes.mjs --all
            git add -A -- '*.md'
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "docs: reconcile learning indexes"
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          echo "Could not publish the indexes on the current main branch." >&2
          exit 1
